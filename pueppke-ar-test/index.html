<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Püppke auf der Hand</title>
<style>
  @font-face{font-family:"ABeeZee";src:url(lib/fonts/abeezee.ttf) format("truetype");font-display:swap}
  /* Vollbild-Kamera, Figur als 3D-Ebene darüber, Bedienung als schwebende Leiste unten */
  :root{
    --flieder:#b9a4d6; --flieder-dunkel:#5b4682; --gelb:#f6d24a;
    --wald:#24301f; --hell:#fffdf6; --schatten:0 6px 24px rgba(20,16,30,.28);
    --kind:"ABeeZee", "Comic Sans MS", system-ui, sans-serif;
  }
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:var(--wald);color:var(--hell);font-family:var(--kind);overflow:hidden}
  #video,#gl{position:fixed;inset:0;width:100%;height:100%}
  #video{object-fit:cover;background:#000}
  #video.spiegel{transform:scaleX(-1)}
  #gl{pointer-events:none}
  .start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center;
    background:radial-gradient(circle at 50% 35%, #3b4a31 0%, var(--wald) 70%)}
  .start h1{font-size:clamp(28px,8vw,44px);margin:0;line-height:1.1;text-wrap:balance}
  .start p{margin:0;max-width:30ch;font-size:18px;line-height:1.45;opacity:.9}
  .hand{font-size:72px;line-height:1}
  button{font-family:inherit;cursor:pointer;border:0}
  .los{background:var(--gelb);color:var(--wald);font-size:22px;padding:16px 34px;border-radius:999px;box-shadow:var(--schatten)}
  .los:focus-visible,.chip:focus-visible{outline:3px solid var(--hell);outline-offset:3px}
  .test{font-size:13px;opacity:.65}
  .leiste{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:12px;
    background:linear-gradient(to top, rgba(20,24,16,.75), rgba(20,24,16,0))}
  .hinweis{font-size:18px;text-align:center;background:rgba(91,70,130,.85);padding:10px 18px;border-radius:16px;box-shadow:var(--schatten);max-width:32ch;transition:opacity .3s}
  .hinweis.weg{opacity:0}
  .chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .chip{background:rgba(255,253,246,.92);color:var(--flieder-dunkel);font-size:17px;padding:10px 18px;border-radius:999px;box-shadow:var(--schatten)}
  .chip[aria-pressed="true"]{background:var(--gelb);color:var(--wald)}
  .oben{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
  .badge{background:rgba(0,0,0,.45);padding:6px 12px;border-radius:999px}
  .fehler{color:var(--gelb);max-width:32ch}
  @media (prefers-reduced-motion: reduce){ .hinweis{transition:none} }
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="gl"></canvas>

<div class="oben" id="oben" hidden>
  <span class="badge">Testversion · Platzhalter-Figur</span>
  <span class="badge" id="fps"></span>
</div>

<div class="leiste" id="leiste" hidden>
  <div class="hinweis" id="hinweis">Streck deine Hand flach vor die Kamera</div>
  <div class="chips" role="group" aria-label="Figur wählen">
    <button class="chip" id="b-pueppke" aria-pressed="true">Püppke</button>
    <button class="chip" id="b-manfred" aria-pressed="false">Manfred</button>
  </div>
</div>

<section class="start" id="start">
  <div class="hand" aria-hidden="true">✋</div>
  <h1>Wer sitzt auf deiner Hand?</h1>
  <p>Halte das Handy in einer Hand. Streck die andere Hand flach vor die Kamera, und Püppke hüpft darauf.</p>
  <button class="los" id="los">Kamera starten</button>
  <p class="fehler" id="fehler" hidden></p>
  <p class="test">Test für den Naturlernpfad Wentruper Berge. Es wird nichts gespeichert oder verschickt.</p>
</section>

<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "./lib/addons/loaders/GLTFLoader.js";
import { FilesetResolver, HandLandmarker } from "./lib/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const video = $("video"), canvas = $("gl");

/* ---------- 3D-Szene ---------- */
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
let W = innerWidth, H = innerHeight;
const cam = new THREE.OrthographicCamera(0, W, 0, -H, -2000, 2000);
function resize(){ W = innerWidth; H = innerHeight; renderer.setSize(W, H, false);
  cam.left = 0; cam.right = W; cam.top = 0; cam.bottom = -H; cam.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

scene.add(new THREE.HemisphereLight(0xfffaf0, 0x8a7a5a, 2.2));
const sonne = new THREE.DirectionalLight(0xffffff, 2.2); sonne.position.set(-0.6, 1, 1.2); scene.add(sonne);

const mat = (c, r = 0.85) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
const kugel = (r, m, sx = 1, sy = 1, sz = 1) => { const k = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 24), m); k.scale.set(sx, sy, sz); return k; };

const at = (m, x, y, z) => { m.position.set(x, y, z); return m; };

function schattenScheibe(){
  const s = new THREE.Mesh(new THREE.CircleGeometry(0.42, 40), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.28, depthWrite: false }));
  s.rotation.x = -Math.PI / 2; s.scale.set(1, 0.6, 1); return s;
}

/* Püppke nach dem Charakterblatt: sehr lange blattförmige Ohren mit orangen Spitzen, großer runder Kopf,
   Augen weit außen, birnenförmiger Körper mit hellem Bauch, dünne Arme, lange Hasenbeine mit großen Füßen */
function papierTextur(){
  const c = document.createElement("canvas"); c.width = c.height = 256; const x = c.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 9000; i++) { const v = 215 + Math.random() * 40; x.fillStyle = `rgba(${v},${v},${v - 10},0.35)`; x.fillRect(Math.random() * 256, Math.random() * 256, 1 + Math.random() * 2, 1 + Math.random() * 3); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 3); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const papier = papierTextur();
const mal = (c, extra = {}) => new THREE.MeshLambertMaterial({ color: c, map: papier, ...extra });

// Rotationskörper aus Profilpunkten [radius, höhe]
const drehkoerper = (profil, m, seg = 40) => new THREE.Mesh(new THREE.LatheGeometry(profil.map(([r, h]) => new THREE.Vector2(r, h)), seg), m);

// Blattförmiges Ohr mit Farbverlauf gelb → orange zur Spitze und zu den Rändern
function baueOhr(laenge, breite){
  const prof = []; const n = 24;
  for (let i = 0; i <= n; i++) { const t = i / n; prof.push(new THREE.Vector2(Math.sin(Math.PI * Math.pow(t, 0.72)) * breite * (1 - 0.15 * t), t * laenge)); }
  const geo = new THREE.LatheGeometry(prof, 32);
  const pos = geo.attributes.position, farben = [], gelb = new THREE.Color(0xf6b61f), orange = new THREE.Color(0xe2601f), innen = new THREE.Color(0xeb7a2c), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i) / laenge, z = pos.getZ(i), xr = Math.abs(pos.getX(i)) / breite;
    let k = Math.max(0, (y - 0.3) / 0.6); k = Math.min(1, k * 1.25 + (xr > 0.6 ? (xr - 0.6) * 2.2 : 0) * y);
    c.copy(gelb).lerp(z > 0 ? innen : orange, k * (z > 0 ? 0.8 : 1)); farben.push(c.r, c.g, c.b);
  }
  geo.setAttribute("color", new THREE.Float32BufferAttribute(farben, 3));
  const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true, map: papier }));
  m.scale.z = 0.28; // flach wie ein Blatt
  return m;
}

function baueHase(){
  const g = new THREE.Group();
  const fell = mal(0xf6b61f), bauch = mal(0xf8d77a), nase = mal(0xd9502a), weiss = new THREE.MeshLambertMaterial({ color: 0xffffff }),
        schwarz = new THREE.MeshLambertMaterial({ color: 0x141010 }), mund = new THREE.MeshLambertMaterial({ color: 0x3a1a12 }), schwanz = mal(0xfdf4dc);
  const kapsel = (r, l, m) => new THREE.Mesh(new THREE.CapsuleGeometry(r, l, 8, 16), m);
  const koerper = new THREE.Group(); g.add(koerper);

  // birnenförmiger Rumpf mit dünnem Hals
  const rumpf = drehkoerper([[0,0.22],[0.13,0.24],[0.19,0.32],[0.2,0.42],[0.18,0.54],[0.15,0.64],[0.12,0.72],[0,0.8]], fell);
  rumpf.scale.z = 0.85; koerper.add(rumpf);
  const b = drehkoerper([[0,0.24],[0.12,0.26],[0.165,0.33],[0.17,0.43],[0.14,0.55],[0.09,0.65],[0,0.7]], bauch);
  b.scale.set(0.9, 1, 0.62); b.position.z = 0.075; koerper.add(b);

  // lange Hasenbeine: Oberschenkel, dünner Unterschenkel, großer Fuß
  for (const s of [-1, 1]) {
    koerper.add(at(kugel(0.115, fell, 0.85, 1.2, 1.1), 0.12 * s, 0.22, -0.01));
    const unten = kapsel(0.04, 0.07, fell); unten.position.set(0.14 * s, 0.08, 0.0); unten.rotation.x = 0.25; koerper.add(unten);
    koerper.add(at(kugel(0.06, fell, 0.85, 0.42, 2.4), 0.15 * s, 0.025, 0.08));
  }

  // dünne Arme, leicht abgespreizt, kleine Hände
  const arme = [];
  for (const s of [-1, 1]) {
    const a = new THREE.Group(); a.position.set(0.13 * s, 0.62, 0.02); koerper.add(a);
    const m = kapsel(0.028, 0.2, fell); m.position.set(0, -0.12, 0); a.add(m);
    a.add(at(kugel(0.04, fell, 1, 0.9, 0.8), 0, -0.25, 0));
    arme.push(a);
  }
  koerper.add(at(kugel(0.07, schwanz), 0, 0.3, -0.17));

  // großer runder Kopf, Wangen, kleine Schnauze mit dreieckiger Nase, offener lachender Mund
  const kopf = new THREE.Group(); kopf.position.set(0, 0.9, 0.0); koerper.add(kopf);
  kopf.add(kugel(0.2, fell, 1.12, 1, 1));
  kopf.add(at(kugel(0.1, fell, 1.05, 0.85, 1.1), 0, -0.04, 0.12));
  kopf.add(at(kugel(0.1, bauch, 1.15, 0.75, 0.8), 0, -0.08, 0.14));
  const n = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.04, 3), nase); n.rotation.set(Math.PI / 2, 0, Math.PI); n.position.set(0, -0.005, 0.245); kopf.add(n);
  const mm = kugel(0.04, mund, 1.2, 0.7, 0.4); mm.position.set(0, -0.085, 0.2); kopf.add(mm);
  for (const s of [-1, 1]) {
    // Augen weit außen: großer weißer Kreis, große Pupille, Glanzpunkt
    const auge = new THREE.Group(); auge.position.set(0.13 * s, 0.04, 0.12); auge.rotation.y = 0.7 * s; kopf.add(auge);
    auge.add(kugel(0.1, weiss, 1, 1.02, 0.45));
    auge.add(at(kugel(0.068, schwarz, 1, 1.05, 0.4), 0.012 * s, -0.008, 0.025));
    auge.add(at(kugel(0.018, weiss), -0.01 * s, 0.03, 0.05));
    const pts = [];
    for (const dy of [-0.03, 0, 0.03]) pts.push(new THREE.Vector3(0.06 * s, -0.04, 0.19), new THREE.Vector3(0.3 * s, -0.04 + dy * 1.6, 0.12));
    kopf.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0x7a6a5a })));
  }

  // sehr lange Ohren, leicht nach außen und hinten
  const ohren = [];
  for (const s of [-1, 1]) {
    const o = new THREE.Group(); o.position.set(0.07 * s, 0.14, -0.03); o.rotation.set(-0.2, 0.25 * s, -0.16 * s); kopf.add(o);
    o.add(baueOhr(0.82, 0.135));
    ohren.push(o);
  }

  g.add(schattenScheibe());
  g.userData.tick = t => {
    const phase = t % 3.2; const hop = phase < 0.9 ? Math.abs(Math.sin(phase / 0.9 * Math.PI * 2)) * 0.2 : 0;
    koerper.position.y = hop;
    ohren[0].rotation.x = -0.2 + Math.sin(t * 3) * 0.07 - hop * 1.3;
    ohren[1].rotation.x = -0.2 + Math.sin(t * 3 + 1) * 0.07 - hop * 1.3;
    kopf.rotation.z = Math.sin(t * 1.3) * 0.08;
    arme[0].rotation.z = -0.7 - (hop ? 1.0 : 0.4 + Math.sin(t * 7) * 0.4);  // winkt
    arme[1].rotation.z = 0.7 + (hop ? 1.0 : 0.1);
    g.children.at(-1).scale.setScalar(1 - hop * 1.2);
  };
  return g;
}

/* Manfred: Maulwurf (Platzhalter aus Grundformen) */
function baueMaulwurf(){
  const g = new THREE.Group(), fell = mat(0x3b3434, 0.95), rosa = mat(0xe8a0a8, 0.6), dunkel = mat(0x0c0a0a, 0.3);
  const koerper = new THREE.Group(); g.add(koerper);
  koerper.add(at(kugel(0.36, fell, 1.05, 0.95, 1), 0, 0.34, 0));
  const kopf = new THREE.Group(); kopf.position.set(0, 0.6, 0.16); koerper.add(kopf);
  kopf.add(kugel(0.24, fell, 1, 0.9, 1));
  const nase = new THREE.Mesh(new THREE.ConeGeometry(0.075, 0.2, 20), rosa); nase.rotation.x = Math.PI / 2; nase.position.set(0, -0.03, 0.3); kopf.add(nase);
  kopf.add(at(kugel(0.045, rosa), 0, -0.03, 0.4));
  for (const s of [-1, 1]) kopf.add(at(kugel(0.022, dunkel), 0.1 * s, 0.07, 0.2));
  const haende = [];
  for (const s of [-1, 1]) {
    const h = new THREE.Group(); h.position.set(0.3 * s, 0.32, 0.2); koerper.add(h);
    h.add(kugel(0.13, rosa, 1, 1.15, 0.45));
    for (let i = -2; i <= 2; i++) h.add(at(kugel(0.025, mat(0xf4e9d8, 0.4), 1, 1.8, 1), i * 0.045, 0.15, 0));
    haende.push(h);
  }
  for (const s of [-1, 1]) koerper.add(at(kugel(0.08, rosa, 1, 0.5, 1.4), 0.18 * s, 0.04, 0.08));
  g.add(schattenScheibe());
  g.userData.tick = t => {
    const grab = Math.sin(t * 6) * 0.5;
    haende[0].rotation.z = 0.4 + grab; haende[1].rotation.z = -0.4 + grab;
    haende[0].rotation.x = haende[1].rotation.x = -0.3;
    koerper.rotation.z = Math.sin(t * 2) * 0.07;
    kopf.rotation.x = Math.sin(t * 2.5) * 0.12; // schnuppert
  };
  return g;
}

const figuren = { pueppke: baueHase(), manfred: baueMaulwurf() };
const halter = new THREE.Group(); scene.add(halter);
let aktiv = figuren.pueppke; halter.add(aktiv);
function waehle(name){
  halter.remove(aktiv); aktiv = figuren[name]; halter.add(aktiv);
  $("b-pueppke").setAttribute("aria-pressed", name === "pueppke");
  $("b-manfred").setAttribute("aria-pressed", name === "manfred");
}
$("b-pueppke").onclick = () => waehle("pueppke");
$("b-manfred").onclick = () => waehle("manfred");

/* Püppke aus Andreas' 3D-Modell (modelle/pueppke.glb). Einzelteile werden zu Gelenken gruppiert,
   damit Ohren, Arme und Kopf sich bewegen können. Modell ist Z-oben, Blick nach -Y. */
async function ladePueppkeGLB(){
  const gltf = await new GLTFLoader().loadAsync("./modelle/pueppke.glb");
  const teile = {};
  gltf.scene.traverse(o => { if (o.isMesh) {
    if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
    const col = o.geometry.attributes.color;   // Farben liegen als sRGB vor → für korrekte Sättigung umrechnen
    if (col && !col.normalized) for (let i = 0; i < col.count; i++) col.setXYZ(i, ...[col.getX(i), col.getY(i), col.getZ(i)].map(v => Math.pow(v, 2.2)));
    if (col && col.normalized) { const f = new Float32Array(col.count * 3); for (let i = 0; i < col.count; i++) { f[i*3] = Math.pow(col.getX(i), 2.2); f[i*3+1] = Math.pow(col.getY(i), 2.2); f[i*3+2] = Math.pow(col.getZ(i), 2.2); } o.geometry.setAttribute("color", new THREE.BufferAttribute(f, 3)); }
    o.material = new THREE.MeshLambertMaterial({ vertexColors: true });
    teile[parseInt(o.name.split("_").pop(), 10)] = o;
  }});
  const modell = new THREE.Group();          // in Modellkoordinaten (Z oben)
  const gelenk = (ids, px, py, pz) => {      // Gruppe mit Drehpunkt
    const gr = new THREE.Group(); gr.position.set(px, py, pz);
    for (const i of ids) if (teile[i]) { const m = teile[i]; m.position.set(-px, -py, -pz); gr.add(m); }
    return gr;
  };
  const kopf = gelenk([2, 3, 4, 5, 6, 7, 8, 9, 23, 24, 25, 26, 27, 28], 0, 0, 1.75);
  const ohrL = gelenk([10, 11], -0.2, 0, 2.62), ohrR = gelenk([12, 13], 0.2, 0, 2.6);
  // Ohren hängen am Kopf: Drehpunkt relativ zum Kopf
  for (const o of [ohrL, ohrR]) { o.position.z -= 1.75; kopf.add(o); }
  const armL = gelenk([14, 15], -0.3, 0, 1.52), armR = gelenk([18, 19], 0.3, 0, 1.52);
  const rumpf = new THREE.Group();
  for (const i of [0, 1, 16, 17, 20, 21, 22]) if (teile[i]) rumpf.add(teile[i]);
  const koerper = new THREE.Group(); koerper.add(rumpf, kopf, armL, armR);
  modell.add(koerper);
  modell.rotation.x = -Math.PI / 2;           // Z-oben → Y-oben, Blick zur Kamera
  modell.scale.setScalar(1.75 / 3.88);        // gleiche Größe wie bisher
  const g = new THREE.Group(); g.add(modell); g.add(schattenScheibe());
  g.userData.tick = t => {
    const phase = t % 3.2; const hop = phase < 0.9 ? Math.abs(Math.sin(phase / 0.9 * Math.PI * 2)) * 0.45 : 0;
    koerper.position.z = hop;
    ohrL.rotation.x = Math.sin(t * 3) * 0.08 + hop * 0.5;  ohrL.rotation.y = -Math.sin(t * 2.2) * 0.06;
    ohrR.rotation.x = Math.sin(t * 3 + 1) * 0.08 + hop * 0.5; ohrR.rotation.y = Math.sin(t * 2.2 + 1) * 0.06;
    kopf.rotation.y = Math.sin(t * 1.3) * 0.08;
    armR.rotation.y = hop ? -0.8 : -0.3 - (Math.sin(t * 7) * 0.5 + 0.5) * 0.9;   // winkt
    armL.rotation.y = hop ? 0.8 : 0.1;
    g.children.at(-1).scale.setScalar(1 - hop * 0.5);
  };
  return g;
}
ladePueppkeGLB().then(g => {
  const warAktiv = aktiv === figuren.pueppke;
  figuren.pueppke = g;
  if (warAktiv) waehle("pueppke");
}).catch(e => console.warn("3D-Modell nicht geladen, Platzhalter bleibt", e));

/* ---------- Kamera + Handerkennung ---------- */
let landmarker, gespiegelt = false;
async function starte(){
  $("los").disabled = true; $("los").textContent = "Einen Moment …";
  try {
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }); }
    catch { stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false }); gespiegelt = true; }
    video.srcObject = stream; video.classList.toggle("spiegel", gespiegelt);
    await video.play();
    const files = await FilesetResolver.forVisionTasks("./lib/wasm");
    const opts = d => ({ baseOptions: { modelAssetPath: "./lib/hand_landmarker.task", delegate: d }, runningMode: "VIDEO", numHands: 1 });
    try { landmarker = await HandLandmarker.createFromOptions(files, opts("GPU")); }
    catch { landmarker = await HandLandmarker.createFromOptions(files, opts("CPU")); }
    $("start").hidden = true; $("leiste").hidden = false; $("oben").hidden = false;
    requestAnimationFrame(schleife);
  } catch (e) {
    $("los").disabled = false; $("los").textContent = "Nochmal versuchen";
    $("fehler").hidden = false;
    $("fehler").textContent = (e && e.name === "NotAllowedError")
      ? "Die Kamera wurde nicht erlaubt. Bitte in den Browser-Einstellungen die Kamera für diese Seite freigeben."
      : "Die Kamera oder die Handerkennung ließ sich nicht starten (" + (e && e.message || e) + ").";
  }
}
$("los").onclick = starte;
if (location.hash.startsWith("#studio")) { renderer.setClearColor(0xfbf7ee, 1); $("start").hidden = true; document.documentElement.style.background = document.body.style.background = "#fbf7ee"; requestAnimationFrame(schleife); }

/* Bildkoordinaten (0..1) → Bildschirmpixel, passend zu object-fit: cover */
function aufBildschirm(p){
  const vw = video.videoWidth, vh = video.videoHeight, s = Math.max(W / vw, H / vh);
  let x = p.x * vw * s + (W - vw * s) / 2;
  if (gespiegelt) x = W - x;
  return { x, y: p.y * vh * s + (H - vh * s) / 2 };
}

const glatt = { x: 0, y: 0, gr: 0, rot: 0, sicht: 0 };
let letzteHand = -1e9, letzteZeit = -1, frames = 0, fpsZeit = performance.now();
const lerp = (a, b, k) => a + (b - a) * k;

function schleife(now){
  requestAnimationFrame(schleife);
  const studio = location.hash.startsWith("#studio");
  if (!studio && video.readyState >= 2 && video.currentTime !== letzteZeit) {
    letzteZeit = video.currentTime;
    const res = landmarker.detectForVideo(video, now);
    const lm = res.landmarks && res.landmarks[0];
    if (lm) {
      const P = i => aufBildschirm(lm[i]);
      const hg = P(0), mitte = P(9);
      const ids = [0, 5, 9, 13, 17]; let cx = 0, cy = 0;
      for (const i of ids) { const q = P(i); cx += q.x; cy += q.y; } cx /= 5; cy /= 5;
      const breite = Math.hypot(P(5).x - P(17).x, P(5).y - P(17).y);
      const laenge = Math.hypot(mitte.x - hg.x, mitte.y - hg.y);
      const gr = Math.max(breite * 1.6, laenge * 1.05);           // Figur etwa so groß wie die Handfläche
      let rot = Math.atan2(mitte.x - hg.x, -(mitte.y - hg.y));    // Neigung der Hand
      rot = Math.max(-0.7, Math.min(0.7, rot));
      const k = glatt.sicht < 0.05 ? 1 : 0.35;
      glatt.x = lerp(glatt.x, cx, k); glatt.y = lerp(glatt.y, cy + gr * 0.12, k);
      glatt.gr = lerp(glatt.gr, gr, k); glatt.rot = lerp(glatt.rot, rot, 0.25);
      letzteHand = now;
    }
  }
  if (location.hash === "#demo") { glatt.x = W / 2; glatt.y = H * 0.62; glatt.gr = Math.min(W, H) * 0.45; letzteHand = now; }
  const da = now - letzteHand < 350;
  glatt.sicht = lerp(glatt.sicht, da ? 1 : 0, 0.15);
  $("hinweis").classList.toggle("weg", now - letzteHand < 1200);

  const t = studio ? 0.5 : now / 1000;
  if (studio) { glatt.x = W / 2; glatt.y = H * 0.88; glatt.gr = H * 0.4; letzteHand = now; glatt.sicht = 1; }
  aktiv.userData.tick(t);
  halter.position.set(glatt.x, -glatt.y, 0);
  halter.scale.setScalar(Math.max(0.001, glatt.gr * glatt.sicht));
  halter.rotation.set(0.32, Math.sin(t * 0.7) * 0.6, -glatt.rot);   // leicht von oben + langsames Drehen, damit man das 3D sieht
  if (studio) halter.rotation.set(0.1, (parseFloat(location.hash.slice(7)) || 0) * Math.PI / 180, 0);
  halter.visible = glatt.sicht > 0.02;
  renderer.render(scene, cam);

  frames++; if (now - fpsZeit > 1000) { $("fps").textContent = frames + " Bilder/s"; frames = 0; fpsZeit = now; }
}
</script>
